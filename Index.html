<!DOCTYPE html>
<html>
<head>
    <title>Highqub</title>
</head>

<body>

    <h1>ዕቁብ</h1>

    <h2>ኣባል መዝግብ</h2>

    <form>
        <label>ስም ኣባል:</label><br>
        <input type="text" id="name"><br><br>

        <label>ቁጽሪ ስልኪ:</label><br>
        <input type="tel" id="phone"><br><br>

        <label>ወርሓዊ ክፍያ:</label><br>
        <input type="number" id="payment"><br><br>

        <<button type="button" onclick="registerMember()">ኣባል መዝግብ</button>
        
    </form>
<script>
function registerMember() {
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let payment = document.getElementById("payment").value;

    if (name === "" || phone === "" || payment === "") {
        alert("ኩሎም ቦታታት ምላእ");
        return;
    }

    alert("ኣባል " + name + " ብትኽክል ተመዝጊቡ");
}
</script>
</body>
</html>
