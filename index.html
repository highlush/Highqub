<!DOCTYPE html>
<html>
<head>
    <title>Highqub</title>
</head>

<body>

    <h1>ዕቁብ</h1>

    <h2>ኣባል መዝግብ</h2>

    <form>
        <label>ስም ኣባል:</label><br>
        <input type="text" id="name"><br><br>

        <label>ቁጽሪ ስልኪ:</label><br>
        <input type="tel" id="phone"><br><br>

        <label>ወርሓዊ ክፍያ:</label><br>
        <input type="number" id="payment"><br><br>

        <button type="button" onclick="registerMember()">
            ኣባል መዝግብ
        </button>
    </form>

    <h2>ዝተመዝገቡ ኣባላት</h2>

    <table border="1">
        <tr>
            <th>ስም</th>
            <th>ስልኪ</th>
            <th>ወርሓዊ ክፍያ</th>
        </tr>

        <tbody id="memberList">
        </tbody>
    </table>

<script>

function registerMember() {

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let payment = document.getElementById("payment").value;

    if (name === "" || phone === "" || payment === "") {
        alert("ኩሎም ቦታታት ምላእ");
        return;
    }

    let table = document.getElementById("memberList");

    let row = table.insertRow();

    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = phone;
    row.insertCell(2).innerHTML = payment;

    alert("ኣባል " + name + " ብትኽክል ተመዝጊቡ");

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("payment").value = "";
}

</script>

</body>
</html>
