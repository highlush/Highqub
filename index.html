<!DOCTYPE html>
<html>
<head>
    <title>Highqub</title>
</head>

<body>

<h1>ዕቁብ</h1>

<h2>ኣባል መዝግብ</h2>

<form>

<label>ስም ኣባል:</label><br>
<input type="text" id="name"><br><br>

<label>ቁጽሪ ስልኪ:</label><br>
<input type="tel" id="phone"><br><br>

<label>ወርሓዊ ክፍያ:</label><br>
<input type="number" id="payment"><br><br>

<button type="button" onclick="registerMember()">
ኣባል መዝግብ
</button>

</form>

<h2>ዝተመዝገቡ ኣባላት</h2>

<table border="1">

<tr>
<th>ስም</th>
<th>ስልኪ</th>
<th>ወርሓዊ ክፍያ</th>
<th>ተግባር</th>
</tr>

<tbody id="memberList">
</tbody>

</table>

<script>

let members = JSON.parse(localStorage.getItem("members")) || [];

function displayMembers() {

    let table = document.getElementById("memberList");

    table.innerHTML = "";

    members.forEach(function(member, index) {

        let row = table.insertRow();

        row.insertCell(0).textContent = member.name;
        row.insertCell(1).textContent = member.phone;
        row.insertCell(2).textContent = member.payment;

        let action = row.insertCell(3);

        action.innerHTML =
            '<button onclick="deleteMember(' + index + ')">ሰርዝ</button>';

    });
}

function registerMember() {

    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let payment = document.getElementById("payment").value.trim();

    if (name === "" || phone === "" || payment === "") {

        alert("ኩሎም ቦታታት ምላእ");
        return;
    }

    members.push({
        name: name,
        phone: phone,
        payment: payment
    });

    localStorage.setItem("members", JSON.stringify(members));

    displayMembers();

    alert("ኣባል " + name + " ብትኽክል ተመዝጊቡ");

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("payment").value = "";
}

function deleteMember(index) {

    if (confirm("እዚ ኣባል ክስረዝ ትደሊ ዲኻ?")) {

        members.splice(index, 1);

        localStorage.setItem("members", JSON.stringify(members));

        displayMembers();
    }
}

displayMembers();

</script>

</body>
</html>
